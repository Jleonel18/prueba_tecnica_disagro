name: main

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  docker:
    needs: test-backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            build_args: ""
          - service: frontend
            context: ./frontend
            build_args: VITE_API_URL=${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera ghcr.io/<owner>/<repo>-<service>:<sha> y :latest (metadata-action pasa el owner a minúsculas)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    env:
      HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
      HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
    steps:
      - name: Deploy backend en Render
        if: env.HOOK_BACKEND != ''
        run: curl -fsS "${HOOK_BACKEND}&imgURL=ghcr.io/${GITHUB_REPOSITORY,,}-backend:${GITHUB_SHA}"

      - name: Deploy frontend en Render
        if: env.HOOK_FRONTEND != ''
        run: curl -fsS "${HOOK_FRONTEND}&imgURL=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:${GITHUB_SHA}"
