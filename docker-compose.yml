services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:8081
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "8081:80"
    depends_on:
      - backend
